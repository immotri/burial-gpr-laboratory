name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: toolkit/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install scientific dependencies
        run: python -m pip install -r toolkit/requirements.txt
      - name: Numerical tests
        run: python -m unittest discover -s toolkit -v
      - name: Shared model and section checks
        run: python scripts/test_geometry_parity.py
      - name: Cemetery geometry and materials
        run: python scripts/test_cemetery_parity.py
      - name: Build downloadable toolkit
        run: python scripts/build_release.py
      - name: Check static website assets and JavaScript
        run: python scripts/check_web.py
